name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    # The integration suite runs against a real PostgreSQL server here, per
    # docs/testing/testing-strategy.md. Locally it falls back to PGlite when
    # TEST_DATABASE_URL is unset — see docs/decisions/0017-integration-test-database.md.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: expense_reconciliation_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Verify migrations match the schema
        run: npm run db:check

      - name: Test (against a real PostgreSQL server)
        run: npm test
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/expense_reconciliation_test

      - name: Test (against the in-process PGlite fallback)
        # Runs the same suite the way a developer without Docker runs it, so the fallback
        # path cannot silently rot.
        run: npm test

  # `web/` is a separate package with its own lockfile, tsconfig, ESLint config and Prettier
  # standard (ADR-0042), so it gets its own job rather than extra steps in `verify` — a
  # frontend gap phase 15 left open deliberately and phase 21 closes.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # `web/`'s toolchain needs Node 22+: jsdom 30 declares `engines.node`
          # `^22.22.2 || ^24.15.0 || >=26.0.0` and its undici 8 dependency needs `>=22.19.0`
          # (undici's CacheStorage calls `util.markAsUncloneable`, added in Node 22.12). Node 20
          # loads it and throws at import, crashing every test file. The `verify` job stays on
          # 20 — it is a separate package with no such dependency.
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
